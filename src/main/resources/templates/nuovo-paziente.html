<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>DentalApp - Gestione Paziente</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light p-5">

	<div class="container card shadow p-4" style="max-width: 950px;">
		<h2 class="mb-4 text-primary border-bottom pb-2">
			<i class="fas fa-user-md"></i> <span th:text="${paziente.id == null ? 'Nuova Anagrafica e Anamnesi' : 'Aggiornamento Cartella Paziente'}"></span>
		</h2>

		<form th:action="@{/pazienti/salva}" th:object="${paziente}" method="post">
			<input type="hidden" th:field="*{id}">

			<div class="row g-4">
				
				<div class="col-12">
					<div class="bg-primary bg-opacity-10 p-4 rounded border border-primary">
						<h5 class="text-primary fw-bold mb-3">
							<i class="fas fa-id-card me-2"></i> Dati Anagrafici
						</h5>
						<div class="row g-3">
							<div class="col-md-4">
								<label class="form-label fw-bold">Codice Fiscale</label> 
								<input type="text" id="cfInput" th:field="*{codiceFiscale}" class="form-control text-uppercase border-primary border-opacity-50" maxlength="16" oninput="autoCompilaDaCF()" required>
							</div>
							<div class="col-md-4">
								<label class="form-label fw-bold">Nome</label> 
								<input type="text" th:field="*{nome}" class="form-control" required>
							</div>
							<div class="col-md-4">
								<label class="form-label fw-bold">Cognome</label> 
								<input type="text" th:field="*{cognome}" class="form-control" required>
							</div>
							
							<div class="col-md-4">
								<label class="form-label small text-muted">Data di Nascita (auto)</label> 
								<input type="date" id="resDataNascita" class="form-control bg-white text-muted" readonly>
							</div>
							<div class="col-md-2">
								<label class="form-label small text-muted">Sesso (auto)</label> 
								<input type="text" id="resSesso" class="form-control bg-white text-muted" readonly>
							</div>
							<div class="col-md-2">
								<label class="form-label small text-muted">Età (auto)</label> 
								<input type="text" id="resEta" class="form-control bg-white fw-bold text-primary" readonly>
							</div>
							<div class="col-md-4">
								<label class="form-label small fw-bold">Città di Nascita</label> 
								<input type="text" th:field="*{citta}" class="form-control">
							</div>

							<div class="col-md-6 mt-4">
								<label class="form-label fw-bold">Telefono / Cellulare</label> 
								<input type="text" th:field="*{telefono}" class="form-control shadow-sm" required>
							</div>
							<div class="col-md-6 mt-4">
								<label class="form-label fw-bold">Email (Accesso Paziente)</label> 
								<input type="email" th:field="*{email}" class="form-control shadow-sm" th:readonly="${paziente.id != null}" required>
							</div>
						</div>
					</div>
				</div>

				<div class="col-12">
					<div class="bg-danger bg-opacity-10 p-4 rounded border border-danger">
						<h5 class="text-danger fw-bold mb-3 border-bottom border-danger pb-2">
							<i class="fas fa-file-medical me-2"></i> Scheda di Anamnesi Clinica
						</h5>
						<div class="row g-3">
							<div class="col-md-4">
								<label class="form-label fw-bold text-danger">Gruppo Sanguigno</label> 
								<select th:field="*{gruppoSanguigno}" class="form-select border-danger border-opacity-50">
									<option value="">Seleziona...</option>
									<option value="A+">A+</option>
									<option value="A-">A-</option>
									<option value="B+">B+</option>
									<option value="B-">B-</option>
									<option value="AB+">AB+</option>
									<option value="AB-">AB-</option>
									<option value="0+">0+</option>
									<option value="0-">0-</option>
								</select>
							</div>

							<div class="col-md-4">
								<label class="form-label fw-bold text-dark">Stato Fumatore</label> 
								<select th:field="*{fumo}" class="form-select">
									<option value="No">Non fumatore</option>
									<option value="Ex">Ex fumatore</option>
									<option value="Medio">Fumatore (<10/dì)</option>
									<option value="Forte">Fumatore (>10/dì)</option>
								</select>
							</div>

							<div class="col-md-4">
								<label class="form-label fw-bold text-dark">Pacemaker / Dispositivi</label> 
								<select th:field="*{pacemaker}" class="form-select">
									<option th:value="false">No</option>
									<option th:value="true">Sì</option>
								</select>
							</div>

							<div class="col-md-12 mt-4">
								<label class="form-label fw-bold text-dark"><i class="fas fa-exclamation-triangle text-warning me-1"></i> Allergie e Intolleranze</label>
								<textarea th:field="*{allergie}" class="form-control shadow-sm" rows="2" placeholder="Specificare allergie a farmaci, metalli o materiali (Lattice)..."></textarea>
							</div>

							<div class="col-md-12">
								<label class="form-label fw-bold text-dark">Patologie Pregresse o Croniche</label>
								<textarea th:field="*{patologie}" class="form-control shadow-sm" rows="2" placeholder="Esempio: Diabete, Ipertensione, Cardiopatie..."></textarea>
							</div>

							<div class="col-md-12">
								<label class="form-label fw-bold text-primary">Farmaci Assunti Attualmente</label>
								<textarea th:field="*{farmaci}" class="form-control shadow-sm" rows="2" placeholder="Elencare i farmaci assunti con regolarità (es. Anticoagulanti, Bifosfonati)..."></textarea>
							</div>

							<div class="col-md-6">
								<label class="form-label fw-bold text-dark">Gravidanza / Allattamento</label>
								<input type="text" th:field="*{gravidanza}" class="form-control" placeholder="No / Sì (specificare mese)">
							</div>

							<div class="col-md-6">
								<label class="form-label fw-bold text-dark">Interventi Chirurgici Recenti</label>
								<input type="text" th:field="*{noteAggiuntive}" class="form-control" placeholder="Note aggiuntive su interventi passati">
							</div>
						</div>
					</div>
				</div>

				<div class="col-12 mt-4 pt-3 border-top d-flex gap-3">
					<button type="submit" class="btn btn-primary btn-lg flex-grow-1 shadow">
						<i class="fas fa-check-circle me-2"></i>Salva in Cartella Clinica
					</button>
					<a href="/pazienti" class="btn btn-outline-secondary btn-lg px-5 shadow-sm">Annulla</a>
				</div>

			</div>
		</form>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', autoCompilaDaCF);

		function autoCompilaDaCF() {
			const cfInput = document.getElementById("cfInput");
			const cf = cfInput.value.toUpperCase();

			if (cf.length === 16) {
				// 1. Estrazione Anno
				const anno = parseInt(cf.substring(6, 8));
				const annoCorrente = new Date().getFullYear();
				const soglia = annoCorrente % 100;

				const annoCompleto = (anno > soglia) ? 1900 + anno : 2000 + anno;

				// 2. Estrazione Mese
				const mesi = {
					'A' : '01', 'B' : '02', 'C' : '03', 'D' : '04', 'E' : '05', 'H' : '06',
					'L' : '07', 'M' : '08', 'P' : '09', 'R' : '10', 'S' : '11', 'T' : '12'
				};
				const mese = mesi[cf.charAt(8)];

				// 3. Estrazione Giorno e Sesso
				let giornoRaw = parseInt(cf.substring(9, 11));
				const sesso = (giornoRaw > 40) ? "Femmina" : "Maschio";
				const giorno = (giornoRaw > 40) ? giornoRaw - 40 : giornoRaw;
				const giornoStr = giorno < 10 ? "0" + giorno : giorno;

				if (mese && !isNaN(giorno)) {
					const dataNascitaStr = `${annoCompleto}-${mese}-${giornoStr}`;
					document.getElementById("resDataNascita").value = dataNascitaStr;
					document.getElementById("resSesso").value = sesso;

					// --- CALCOLO ETÀ ---
					const dataNascita = new Date(annoCompleto, parseInt(mese) - 1, giorno);
					const oggi = new Date();
					let eta = oggi.getFullYear() - dataNascita.getFullYear();
					const m = oggi.getMonth() - dataNascita.getMonth();

					if (m < 0 || (m === 0 && oggi.getDate() < dataNascita.getDate())) {
						eta--;
					}

					document.getElementById("resEta").value = eta + " anni";
				}
			} else {
				// Pulisce i campi se il CF non è completo
				document.getElementById("resDataNascita").value = "";
				document.getElementById("resSesso").value = "";
				document.getElementById("resEta").value = "";
			}
		}
	</script>
</body>
</html>
