# Configurazione Server
server.port=8081

# Connessione Database MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/dental_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurazione JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Configurazione Thymeleaf (Frontend)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Configurazione Swagger (Documentazione API)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html